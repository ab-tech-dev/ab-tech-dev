<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Joshua Ability — software, automation, and applied AI</title>
  <desc id="desc">A dark green technical banner with lime details, a connected-system diagram, and Joshua Ability's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09110c"/>
      <stop offset="0.6" stop-color="#0c1710"/>
      <stop offset="1" stop-color="#101c14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.35" r="0.58">
      <stop offset="0" stop-color="#bdf36f" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bdf36f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9efd0" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#bdf36f" stroke-opacity="0.2"/>

  <g fill="none" stroke="#bdf36f">
    <path d="M766 182C822 182 814 96 870 96H936" stroke-opacity="0.38"/>
    <path d="M766 182H965C1017 182 1000 252 1060 252H1138" stroke-opacity="0.23"/>
    <path d="M838 182C895 182 886 145 943 145H1114" stroke-opacity="0.18"/>
    <circle cx="766" cy="182" r="5" fill="#bdf36f" stroke="none"/>
    <circle cx="870" cy="96" r="8" fill="#0c1710" stroke-opacity="0.8"/>
    <circle cx="965" cy="182" r="10" fill="#0c1710" stroke-opacity="0.6"/>
    <circle cx="1060" cy="252" r="7" fill="#0c1710" stroke-opacity="0.7"/>
    <circle cx="1114" cy="145" r="5" fill="#bdf36f" stroke="none"/>
    <circle cx="965" cy="182" r="40" stroke-opacity="0.08"/>
    <circle cx="965" cy="182" r="72" stroke-opacity="0.05"/>
  </g>
  <circle cx="965" cy="182" r="28" fill="#bdf36f" fill-opacity="0.08" filter="url(#soft)"/>

  <text x="62" y="66" fill="#bdf36f" font-family="Consolas, Monaco, monospace" font-size="13" letter-spacing="3">AB-TECH / 01</text>
  <text x="62" y="157" fill="#f0f5ed" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="600" letter-spacing="-3">Joshua Ability</text>
  <text x="64" y="205" fill="#a9b7a5" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="0.4">Software engineer building systems that move work forward.</text>

  <g transform="translate(64 265)" font-family="Consolas, Monaco, monospace" font-size="12" letter-spacing="1.6">
    <text x="0" y="0" fill="#bdf36f">SOFTWARE</text>
    <circle cx="100" cy="-4" r="2" fill="#63725f"/>
    <text x="122" y="0" fill="#d0dacb">AUTOMATION</text>
    <circle cx="245" cy="-4" r="2" fill="#63725f"/>
    <text x="267" y="0" fill="#d0dacb">APPLIED AI</text>
  </g>

  <path d="M64 319H1136" stroke="#d9efd0" stroke-opacity="0.12"/>
  <text x="1136" y="335" text-anchor="end" fill="#6f806b" font-family="Consolas, Monaco, monospace" font-size="10" letter-spacing="1.8">BUILD WITH INTENT</text>
</svg>
